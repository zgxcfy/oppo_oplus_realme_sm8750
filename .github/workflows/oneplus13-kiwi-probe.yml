name: OnePlus 13 Kiwi minimal probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Inspect OnePlus 13 source trees
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/sources"
          mkdir -p "$GITHUB_WORKSPACE/kiwi-probe"

          echo "=== Disk before clone ==="
          df -h "$GITHUB_WORKSPACE"

          {
            echo "workflow_repo=$GITHUB_REPOSITORY"
            echo "workflow_ref=$GITHUB_REF_NAME"
            echo "workflow_commit=$GITHUB_SHA"
            echo "runner=$(uname -a)"
          } > "$GITHUB_WORKSPACE/kiwi-probe/run-info.txt"

      - name: Shallow-clone OnePlusOSS source metadata
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="oneplus/sm8750_b_16.0.0_oneplus_13"
          ROOT="$GITHUB_WORKSPACE/sources"

          clone_tree() {
            local repo="$1"
            local folder="$2"

            echo
            echo "=== Cloning $repo ==="

            git clone \
              --depth=1 \
              --filter=blob:none \
              --no-checkout \
              --single-branch \
              --branch "$BRANCH" \
              "https://github.com/OnePlusOSS/$repo.git" \
              "$ROOT/$folder"

            echo "=== Disk after $folder ==="
            df -h "$GITHUB_WORKSPACE"
          }

          clone_tree \
            android_kernel_common_oneplus_sm8750 \
            common

          clone_tree \
            android_kernel_oneplus_sm8750 \
            msm-kernel

          clone_tree \
            android_kernel_modules_and_devicetree_oneplus_sm8750 \
            modules-and-devicetree

      - name: Generate source and Kiwi reports
        if: always()
        shell: bash
        run: |
          set -u

          ROOT="$GITHUB_WORKSPACE/sources"
          REPORT="$GITHUB_WORKSPACE/kiwi-probe"

          mkdir -p "$REPORT"

          for folder in common msm-kernel modules-and-devicetree; do
            repo="$ROOT/$folder"
            output="$REPORT/$folder"

            mkdir -p "$output"

            if [ ! -d "$repo/.git" ]; then
              echo "Repository clone did not complete." \
                > "$output/status.txt"
              continue
            fi

            {
              echo "=== Repository ==="
              git -C "$repo" remote -v
              echo
              echo "=== Commit ==="
              git -C "$repo" rev-parse HEAD
              git -C "$repo" show -s --format='%ci%n%s' HEAD
            } > "$output/repository.txt" 2>&1

            # 文件名清单，不提取源码正文。
            git -C "$repo" ls-tree -r --name-only HEAD \
              > "$output/all-paths.txt" 2>&1 || true

            grep -Ei \
              'kiwi|qcacld|qca-wifi-host-cmn|wlan/platform|wlan/fw-api|cfg80211|mac80211|wonder|Module\.symvers' \
              "$output/all-paths.txt" \
              > "$output/wlan-paths.txt" || true

            grep -Ei \
              'kiwi.*defconfig|qcacld-3\.0/(BUILD\.bazel|Kbuild|Makefile|wlan_qcacld3_modules\.bzl)|wlan/platform/(BUILD\.bazel|Kbuild|Makefile|wlan_platform_modules\.bzl)' \
              "$output/all-paths.txt" \
              > "$output/build-paths.txt" || true
          done

          {
            echo "=== Disk after inspection ==="
            df -h "$GITHUB_WORKSPACE"
            echo
            echo "=== Report files ==="
            find "$REPORT" -type f -printf '%P %s bytes\n' | sort
          } > "$REPORT/summary.txt"

          cat "$REPORT/summary.txt"

      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus13-kiwi-minimal-probe
          path: kiwi-probe/
          if-no-files-found: warn
          retention-days: 14
