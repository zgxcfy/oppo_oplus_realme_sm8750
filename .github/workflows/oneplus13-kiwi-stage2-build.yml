name: OnePlus13 Kiwi stage 2 baseline build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Prepare workspace and repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/oneplus13" "$GITHUB_WORKSPACE/kiwi-stage2"
          sudo apt-get update
          sudo apt-get install -y repo git python3 ca-certificates
          df -h "$GITHUB_WORKSPACE" | tee "$GITHUB_WORKSPACE/kiwi-stage2/disk-before.txt"
      - name: Initialize pinned official manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/oneplus13"
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b oneplus/sm8750 -m oneplus_13_b.xml --depth=1
          git -C .repo/manifests fetch --depth=1 origin f8e50677874c65b6da41057d2f39be7b4ef3c08a
          git -C .repo/manifests checkout --detach f8e50677874c65b6da41057d2f39be7b4ef3c08a
          test "$(git -C .repo/manifests rev-parse HEAD)" = f8e50677874c65b6da41057d2f39be7b4ef3c08a
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/eta-pins.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <extend-project name="android_kernel_common_oneplus_sm8750" revision="e1b346b6b4f4096eb342ae3684838a942fd6f6c4"/>
            <extend-project name="android_kernel_oneplus_sm8750" revision="6028f47faddaa27700f8dd3a1d83906ea8f27170"/>
            <extend-project name="android_kernel_modules_and_devicetree_oneplus_sm8750" revision="d50b305f7da9e14715a25120a4ac7b1a4b8b97c3"/>
          </manifest>
          EOF
      - name: Build conservative sync list
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/oneplus13"
          mkdir -p .repo/local_manifests
          repo manifest -o "$GITHUB_WORKSPACE/kiwi-stage2/manifest-resolved.xml"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report=Path(__import__('os').environ['GITHUB_WORKSPACE'])/'kiwi-stage2'
          root=ET.parse(report/'manifest-resolved.xml').getroot()
          rows=[]
          for p in root.findall('project'):
              name=p.get('name',''); path=p.get('path',name); groups=set((p.get('groups') or '').replace(',', ' ').split())
              if name in {'android_kernel_common_oneplus_sm8750','android_kernel_oneplus_sm8750','android_kernel_modules_and_devicetree_oneplus_sm8750'} or groups.intersection({'ddk','ddk-external'}):
                  rows.append((path,name,p.get('revision',''),','.join(sorted(groups))))
          (report/'sync-projects.tsv').write_text('path\tname\trevision\tgroups\n'+''.join('\t'.join(x)+'\n' for x in rows))
          (report/'sync-paths.txt').write_text(''.join(x[1]+'\n' for x in rows))
          print('Selected projects:',len(rows))
          PY
          cat "$GITHUB_WORKSPACE/kiwi-stage2/sync-projects.tsv"
      - name: Sync selected projects with disk guard
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/oneplus13"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            free_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
            echo "free_kb=$free_kb sync=$path" | tee -a "$GITHUB_WORKSPACE/kiwi-stage2/sync-progress.txt"
            if [ "$free_kb" -lt 20971520 ]; then
              echo 'Stopping: less than 20 GiB free; this is a pre-project threshold, not a hard quota.' | tee -a "$GITHUB_WORKSPACE/kiwi-stage2/sync-progress.txt"
              exit 1
            fi
            repo sync -c -j2 --no-tags --fail-fast --no-manifest-update "$path"
          done < "$GITHUB_WORKSPACE/kiwi-stage2/sync-paths.txt"
          repo manifest -o "$GITHUB_WORKSPACE/kiwi-stage2/manifest-declared-after-sync.xml"
          {
            echo "=== common ==="
            git -C kernel_platform/common rev-parse HEAD
            echo "=== msm-kernel ==="
            git -C kernel_platform/msm-kernel rev-parse HEAD
            echo "=== modules-and-devicetree ==="
            git rev-parse HEAD
          } > "$GITHUB_WORKSPACE/kiwi-stage2/checked-out-revisions.txt"
      - name: Verify exact source revisions and Kiwi inputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/oneplus13"
          test "$(git -C kernel_platform/common rev-parse HEAD)" = e1b346b6b4f4096eb342ae3684838a942fd6f6c4
          test "$(git -C kernel_platform/msm-kernel rev-parse HEAD)" = 6028f47faddaa27700f8dd3a1d83906ea8f27170
          test "$(git rev-parse HEAD)" = d50b305f7da9e14715a25120a4ac7b1a4b8b97c3
          test -f vendor/qcom/opensource/wlan/qcacld-3.0/configs/sun_gki_kiwi-v2_defconfig
          test -f vendor/qcom/opensource/wlan/qcacld-3.0/wlan_qcacld3_modules.bzl
          test -x kernel_platform/tools/bazel
      - name: Query Kiwi target and declared dependencies
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/oneplus13"
          KP="$ROOT/kernel_platform"
          REPORT="$GITHUB_WORKSPACE/kiwi-stage2"

          test -f "$ROOT/vendor/qcom/opensource/wlan/qcacld-3.0/BUILD.bazel"
          if [ ! -e "$KP/vendor" ] && [ ! -L "$KP/vendor" ]; then
            ln -s ../vendor "$KP/vendor"
          fi
          test "$(readlink -f "$KP/vendor")" = "$(readlink -f "$ROOT/vendor")"
          test -f "$KP/vendor/qcom/opensource/wlan/qcacld-3.0/BUILD.bazel"

          EXT_SRC="$KP/msm-kernel/msm_kernel_extensions.bzl"
          EXT_DST="$KP/build/msm_kernel_extensions.bzl"
          test -f "$EXT_SRC"
          test -d "$KP/build"
          if [ -e "$EXT_DST" ]; then
            cmp -s "$EXT_SRC" "$EXT_DST" || {
              echo "Existing $EXT_DST differs from $EXT_SRC" >&2
              exit 1
            }
          else
            cp "$EXT_SRC" "$EXT_DST"
          fi

          {
            echo "=== Source layout ==="
            ls -ld "$ROOT/vendor" "$KP/vendor"
            ls -l "$KP/vendor/qcom/opensource/wlan/qcacld-3.0/BUILD.bazel"
            sha256sum "$EXT_SRC" "$EXT_DST"
          } > "$REPORT/source-layout.txt"

          cd "$KP"
          ./tools/bazel cquery \
            'deps(//vendor/qcom/opensource/wlan/qcacld-3.0:sun_perf_qca_cld_kiwi-v2)' \
            --output=label \
            > "$REPORT/kiwi-deps.txt" \
            2> "$REPORT/bazel-query.log"
          wc -l "$REPORT/kiwi-deps.txt"
      - name: Build unmodified Kiwi baseline
        shell: bash
        run: |
          set -euo pipefail
          KP="$GITHUB_WORKSPACE/oneplus13/kernel_platform"
          REPORT="$GITHUB_WORKSPACE/kiwi-stage2"
          cd "$KP"
          df -h "$GITHUB_WORKSPACE" | tee "$REPORT/disk-before-build.txt"
          free_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          if [ "$free_kb" -lt 31457280 ]; then
            echo 'Build skipped: less than 30 GiB free before build.' | tee "$REPORT/build-error.txt"
            exit 1
          fi
          TARGET='//vendor/qcom/opensource/wlan/qcacld-3.0:sun_perf_qca_cld_kiwi-v2'
          echo "$TARGET" > "$REPORT/build-target.txt"
          ./tools/bazel info output_base > "$REPORT/bazel-output-base.txt" 2> "$REPORT/bazel-info.log" || true
          set +e
          ./tools/bazel build --jobs=4 --verbose_failures "$TARGET" > "$REPORT/bazel-build.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$REPORT/bazel-build-exit-code.txt"
          tail -80 "$REPORT/bazel-build.log" || true
          exit "$rc"
      - name: Collect Kiwi baseline outputs
        if: always()
        shell: bash
        run: |
          set -u
          KP="$GITHUB_WORKSPACE/oneplus13/kernel_platform"
          REPORT="$GITHUB_WORKSPACE/kiwi-stage2"
          OUTPUT="$REPORT/build-outputs"
          mkdir -p "$OUTPUT"
          df -h "$GITHUB_WORKSPACE" > "$REPORT/disk-after-build.txt" || true
          SEARCH="$KP/out"
          if [ ! -d "$SEARCH" ]; then
            echo "Output directory unavailable: $SEARCH" > "$REPORT/output-search.txt"
            exit 0
          fi
          find "$SEARCH" -type f \( -name 'qca_cld3_kiwi_v2.ko' -o -name 'cfg80211.ko' -o -name 'mac80211.ko' -o -name 'cnss2.ko' -o -name 'cnss_utils.ko' -o -name 'cnss_prealloc.ko' -o -name 'cnss_nl.ko' -o -name 'ipam.ko' -o -name 'Module.symvers' -o -name 'vmlinux' -o -name 'System.map' -o -name '.config' \) -print > "$REPORT/output-search.txt" 2> "$REPORT/output-search-errors.txt" || true
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            relative="${file#$SEARCH/}"
            if [ "$(basename "$relative")" = '.config' ]; then
              relative="$(dirname "$relative")/kernel.config"
            fi
            mkdir -p "$OUTPUT/$(dirname "$relative")"
            cp -a "$file" "$OUTPUT/$relative" || echo "COPY_FAILED $file" >> "$REPORT/output-search-errors.txt"
          done < "$REPORT/output-search.txt"
          find "$OUTPUT" -type f -printf '%P %s bytes\n' | sort > "$REPORT/build-output-inventory.txt"
          ( cd "$OUTPUT" && find . -type f -print0 | sort -z | xargs -0 -r sha256sum ) > "$REPORT/build-output-SHA256SUMS.txt"
      - name: Collect final diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/kiwi-stage2"
          df -h "$GITHUB_WORKSPACE" > "$GITHUB_WORKSPACE/kiwi-stage2/disk-final.txt" || true
          { echo "workflow_commit=$GITHUB_SHA"; echo "run_id=$GITHUB_RUN_ID"; uname -a; } > "$GITHUB_WORKSPACE/kiwi-stage2/run-info.txt"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus13-kiwi-stage2-baseline-build
          path: kiwi-stage2/
          if-no-files-found: warn
          retention-days: 14
